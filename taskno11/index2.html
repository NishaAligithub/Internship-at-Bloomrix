<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
    <!-- Header / Title Banner -->
    <div class="calc-title">
        <span>Calculator</span>
    </div>
    <div class="display" id="display">0</div>
    <!-- The Button Grid (Mapped to matches your .button-grid and .btn styles) -->
    <div class="button-grid">
        <button class="btn btn-clear" onclick="clearDisplay()">C</button>
        <button class="btn btn-operator" onclick="appendValue('/')">/</button>
        <button class="btn btn-operator" onclick="appendValue('*')">*</button>
        <button class="btn btn-operator" onclick="appendValue('-')">-</button>
        
        <button class="btn" onclick="appendValue('7')">7</button>
        <button class="btn" onclick="appendValue('8')">8</button>
        <button class="btn" onclick="appendValue('9')">9</button>
        <button class="btn btn-operator" onclick="appendValue('+')">+</button>
        
        <button class="btn" onclick="appendValue('4')">4</button>
        <button class="btn" onclick="appendValue('5')">5</button>
        <button class="btn" onclick="appendValue('6')">6</button>
        <button class="btn btn-equals" onclick="calculate()" style="background: #1e3a6b;
    color: white;
    font-weight: 600;
    box-shadow: 0 6px 12px rgba(26, 67, 113, 0.18);
    
    /* Adds vertical span capability */
    grid-row: span 3;
    height: 100%;
">=</button>
        
        <button class="btn" onclick="appendValue('1')">1</button>
        <button class="btn" onclick="appendValue('2')">2</button>
        <button class="btn" onclick="appendValue('3')">3</button>
        
        <button class="btn btn-zero" onclick="appendValue('0')">0</button>
        <button class="btn" onclick="appendValue('.')">.</button>
    </div>

    <!-- Footer Note block from your CSS template -->
    <div class="footer-note">
        <span>Math Engine Active</span>
    </div>
</div>
<script src="script2.js"></script>
</body>
</html>
