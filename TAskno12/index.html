<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List</title>
    <!-- FontAwesome for matching icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Main Screen Header -->
        <div class="header">
            <div class="header-top">
                <i class="fa-solid fa-grid-2"></i>
                <span id="header-date">30 June 2026</span>
                <i class="fa-regular fa-bell"></i>
            </div>
            <div class="header-main">
                <div class="header-title">
                    <h2>Today</h2>
                    <p id="task-counter">0 Tasks</p>
                </div>
                <button class="btn-add-new" id="btn-open-modal">Add New</button>
            </div>
        </div>

        <!-- Main Screen Content UI Frame -->
        <div class="content">
            <!-- Top Mock Calendar Row -->
            <div class="calendar-bar">
                <div class="cal-day active">Mon<br><span>30</span></div>
                <div class="cal-day">Tue<br><span>01</span></div>
                <div class="cal-day">Wed<br><span>02</span></div>
                <div class="cal-day">Thu<br><span>03</span></div>
            </div>

            <h3 class="section-title">My Tasks</h3>

            <!-- Dynamic Task Stack Container -->
            <div class="task-list" id="task-list-container">
                <!-- JavaScript appends items dynamically here -->
            </div>
        </div>

        <!-- Create Task Interactive Drawer Slideout -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Create Task</h3>
                    <button class="modal-close" id="btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="task-form">
                    <div class="form-group">
                        <label for="task-title">Task Title</label>
                        <input type="text" id="task-title" placeholder="e.g., Attend Meeting" required>
                    </div>
                    <div class="form-group">
                        <label for="task-desc">Description</label>
                        <input type="text" id="task-desc" placeholder="e.g., Team sync with client" required>
                    </div>
                    <div class="form-group">
                        <label for="task-time">Time Frame</label>
                        <input type="text" id="task-time" placeholder="e.g., 10:00 - 11:00" required>
                    </div>
                    <button type="submit" class="btn-submit">Save Task</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>

 
</body>
</html>
