<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JavaScript Interactions</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">
    <h2>JavaScript Basic task</h2>

    <div class="section">
        <h3>Alert</h3>
        <button id="alertBtn">Click Me for an Alert</button>
    </div>

    <div class="section">
        <h3>Change Content Dynamically</h3>
        <p id="dynamic-text">This is the original text of the paragraph.</p>
        <button id="changeTextBtn">Change Text</button>
    </div>

    <div class="section">
        <h3> Basic Arithmetic Operation</h3>
        <p>Let's add 10 and 20 together:</p>
        <button id="calcBtn">Calculate Result</button>
        <p>Result: <span id="result">---</span></p>
    </div>
</div>
</body>
</html>
